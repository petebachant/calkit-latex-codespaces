owner: petebachant
name: latex-with-github-codespaces
title: LaTeX with GitHub Codespaces
description: Setting up a collaborative LaTeX environment with Calkit and
  GitHub Codespaces.
git_repo_url: https://github.com/petebachant/calkit-latex-codespaces
publications:
  - path: paper/paper.pdf
    kind: report
    title: The paper
    description: This is the paper.
    stage: build-paper
environments:
  tex:
    kind: docker
    image: texlive/texlive:latest-full
    description: TeXlive full.
pipeline:
  stages:
    build-paper:
      kind: latex
      target_path: paper/paper.tex
      environment: tex
